    <p class="page-title-ja">（さはーらびょう）　名詞・病原体・西大陸群由来</p>
  </div>
  <div class="dict-full">
    <div class="dict-def" style="font-size:0.95rem;line-height:2;">赤道西洋大陸の特定の砂漠性昆虫を媒介とする感染症の仮称。サハール人の隊商ネットワークの中で長期間「軽度の地域病」として安定的に存在していた。東大陸群の住民には強い感染力を持つが致死率は中程度。リンガ人の峠ネットワークを経由して東洋帝国辺境に伝播し、「原因不明の地域病」として長期間過小に記録された。ヴァルン帝国の「疫病の上方歪曲」により、帝国の辺境統治を静かに侵食し続けた。</div>
