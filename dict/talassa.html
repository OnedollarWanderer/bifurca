    <div class="dict-def" style="font-size:0.95rem;line-height:2;">赤道東洋大陸の海洋民族。アウトリガー技術から始まった造船技術が竜骨の発見へと発展し、大洋航行を可能にした。公共財への過小投資という失政パターンを持つ。建物を動かせる建築文化を持ち、衣装も「固定しない」設計。世界をタル・オッサ（海に挟まれた骨）と呼ぶ。</div>
