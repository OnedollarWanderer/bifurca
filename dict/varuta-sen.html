    <div class="dict-def" style="font-size:0.95rem;line-height:2;">ヴァルン人が自分たちの世界をどう呼ぶかを示す固有名称。「縫われた大地」を意味する。「ヴァルタ」が大地・土台、「セン」が縫合・修復を意味し、世界は神の縫い目によって保たれているという宇宙論を一語に収める。その縫い目こそがグランドリッジだとされる。公的文書では「大地（ヴァルタ）」と略されることが多い。</div>
