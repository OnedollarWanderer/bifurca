    <div class="dict-def" style="font-size:0.95rem;line-height:2;">リンガ人が自分たちの世界をどう呼ぶかを示す固有名称。「両岸を持つ川」を意味する。川は流れる動的なものであり、リンガ人だけが世界を「静的な構造物」ではなく「動的なもの」として認識していることを示す。ビフルカという外部名称と最も近い認識構造を持つ世界名でもある。「ビフルカ」が分断を前景化するのに対し「ヴェルタ」は繋がりを前景化している。</div>
