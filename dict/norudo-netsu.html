    <div class="dict-def" style="font-size:0.95rem;line-height:2;">東大陸群の家畜（ノルド東洋大陸由来）から発生した群衆病の仮称。高密度人口・家畜との恒常的接触という条件下で数千年をかけて発生・定着した。東大陸群の住民はほぼ全員が幼少期に経験し終生免疫を得ているが、未感染者には極めて高い致死率を示す。タラッサ人の商船によって無自覚のままコルダ沿岸都市に伝播し、接触後数十年でコルダ沿岸人口の3〜5割を減少させたと推定される。</div>
