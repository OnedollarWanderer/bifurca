    <div class="dict-def" style="font-size:0.95rem;line-height:2;">ヴェルカ人が自分たちの世界をどう呼ぶかを示す固有名称。「壁のある夜」を意味する。「ヌルク」が夜・暗闇、「ヴェル」が壁・境界を意味し、太陽が眠りに行く壁として世界を認識する。口承の語り手が物語を始めるとき「ヌルク・ヴェルの時代に……」という定型句で始める慣習がある。</div>
