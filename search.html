<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サイト内検索 — BIFURCA</title>
<link rel="stylesheet" href="css/style.css">
<style>
.search-wrap { max-width: 700px; margin: 0 auto; }
.search-input-box {
  display: flex;
  gap: 0;
  border: 2px solid var(--ridge);
  background: var(--aged);
  margin-bottom: 2rem;
}
#search-input {
  flex: 1;
  border: none;
  background: transparent;
  font-family: var(--font-sans);
  font-size: 1rem;
  padding: 0.85rem 1.25rem;
  color: var(--ink);
  outline: none;
}
#search-input::placeholder { color: var(--muted); }
.search-btn {
  background: var(--stone);
  color: var(--highlight);
  border: none;
  padding: 0.85rem 1.5rem;
  font-family: var(--font-sans);
  font-size: 0.8rem;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: background 0.15s;
}
.search-btn:hover { background: var(--ridge); color: var(--parchment); }
.search-result {
  border-bottom: 1px solid var(--rule);
  padding: 1rem 0.25rem;
  display: block;
  text-decoration: none;
  color: var(--ink);
  transition: background 0.12s;
}
.search-result:hover { background: rgba(74,63,53,0.05); padding-left: 0.75rem; }
.result-type {
  font-family: var(--font-sans);
  font-size: 0.62rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 0.1rem 0.45rem;
  border: 1px solid currentColor;
  border-radius: 1px;
  margin-right: 0.5rem;
  color: var(--muted);
}
.result-type.type-辞典 { color: var(--east); }
.result-type.type-作品 { color: var(--highlight); }
.result-type.type-ログ { color: var(--ridge); }
.result-type.type-ログ { color: var(--linga); }
.result-title {
  font-family: var(--font-serif);
  font-size: 1rem;
  font-weight: 700;
  color: var(--stone);
  margin: 0.3rem 0 0.2rem;
}
.result-sub {
  font-family: var(--font-sans);
  font-size: 0.78rem;
  color: var(--muted);
  line-height: 1.5;
}
.result-body {
  font-family: var(--font-sans);
  font-size: 0.78rem;
  color: var(--ridge);
  line-height: 1.6;
  margin-top: 0.25rem;
}
.result-highlight { background: rgba(196,154,60,0.25); border-radius: 1px; }
#search-count {
  font-family: var(--font-sans);
  font-size: 0.8rem;
  color: var(--muted);
  margin-bottom: 1rem;
  min-height: 1.5rem;
}
.search-empty {
  text-align: center;
  color: var(--muted);
  font-family: var(--font-sans);
  font-size: 0.88rem;
  padding: 3rem 0;
}
</style>
</head>
<body>
<header class="site-header" data-component="header"></header>
<main class="page-wrap">
  <div class="page-hero">
    <p class="page-eyebrow">Search — サイト内検索</p>
    <h1 class="page-title">検索</h1>
    <p class="page-title-ja">辞典・会話ログ・投稿作品を横断検索します</p>
  </div>
  <div class="search-wrap">
    <div class="search-input-box">
      <input type="text" id="search-input" placeholder="ンガ・ソル、リンガ人、ノルド熱..." autocomplete="off" autofocus>
      <button class="search-btn" onclick="doSearch()">検索</button>
    </div>
    <div id="search-count"></div>
    <div id="search-results"></div>
  </div>
</main>
<footer class="site-footer">
  <p>BIFURCA — ビフルカ世界観アーカイブ</p>
  <p style="margin-top:0.4rem;font-size:0.65rem;color:var(--muted);">本サイトの世界観・設定はCC BY-SA 4.0ライセンスの下で公開されています</p>
</footer>
<script src="js/search-index.js"></script>
<script>
function highlight(text, query) {
  if (!query || !text) return text || '';
  const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return text.replace(re, '<mark class="result-highlight">$1</mark>');
}

function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  const container = document.getElementById('search-results');
  const countEl = document.getElementById('search-count');
  if (!q) { container.innerHTML = ''; countEl.textContent = ''; return; }

  const results = INDEX.filter(item => {
    const hay = (item.title + ' ' + item.subtitle + ' ' + item.body).toLowerCase();
    return q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
  });

  countEl.textContent = results.length > 0 ? results.length + ' 件見つかりました' : '';

  if (results.length === 0) {
    container.innerHTML = '<div class="search-empty">「' + q + '」に一致する項目が見つかりませんでした。</div>';
    return;
  }

  container.innerHTML = results.map(r => {
    const typeClass = 'type-' + r.type;
    const bodySnip = r.body ? '<div class="result-body">' + highlight(r.body, q) + '</div>' : '';
    return '<a class="search-result" href="' + r.url + '">'
      + '<div><span class="result-type ' + typeClass + '">' + r.type + '</span></div>'
      + '<div class="result-title">' + highlight(r.title, q) + '</div>'
      + '<div class="result-sub">' + highlight(r.subtitle, q) + '</div>'
      + bodySnip
      + '</a>';
  }).join('');
}

document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

// URLパラメータから初期クエリ取得
const urlQ = new URLSearchParams(location.search).get('q');
if (urlQ) { document.getElementById('search-input').value = urlQ; doSearch(); }
</script>
</body>
</html>
